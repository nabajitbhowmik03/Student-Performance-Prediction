<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Performance Prediction</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    🎓 Student Performance Prediction System
</header>

<div class="container">
    <h2>Predict Performance</h2>

    <label>Attendance (%)</label>
    <input type="number" id="attendance" placeholder="e.g. 85">

    <label>Study Hours (per day)</label>
    <input type="number" id="study_hours" placeholder="e.g. 5">

    <label>Previous Score (%)</label>
    <input type="number" id="previous_score" placeholder="e.g. 72">

    <label>Assignments Completed</label>
    <input type="number" id="assignments" placeholder="e.g. 8">

    <button onclick="predictPerformance()">Predict</button>

    <div id="resultBox">
        <h3>📊 Prediction Result</h3>
        <p><strong>Predicted Score:</strong> <span id="score"></span></p>
        <p><strong>Performance:</strong> <span id="category"></span></p>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
